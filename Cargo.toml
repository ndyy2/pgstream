[package]
name = "pgstream"
version = "0.3.0"
edition = "2021"
description = "Native PostgreSQL plugin for SA:MP (Rust, Windows x86)"
license = "MIT"

[lib]
name = "pgstream"
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = "0.4.45"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tokio-postgres-rustls = "0.12"
webpki-roots = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
bytes = "1"
once_cell = "1.20"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[profile.release]
panic = "abort"
opt-level = 2
